version: "3.8"

services:

  coordinator:
    build:
      context: .
      dockerfile: python_voting/coordinator.Dockerfile
    container_name: coordinator
    ports:
      - "50050:50050"  # Python voting coordinator
      - "60055:60051"  # Go decision coordinator
    networks:
      - twopc_network
    environment:
      - NODE_ID=coordinator

  participant1:
    build:
      context: .
      dockerfile: python_voting/participant.Dockerfile
    container_name: participant1
    ports:
      - "50051:50051"  # Python voting
      - "60051:60051"  # Go decision
    networks:
      - twopc_network
    environment:
      - NODE_ID=participant1

  participant2:
    build:
      context: .
      dockerfile: python_voting/participant.Dockerfile
    container_name: participant2
    ports:
      - "50052:50051"
      - "60052:60051"
    networks:
      - twopc_network
    environment:
      - NODE_ID=participant2

  participant3:
    build:
      context: .
      dockerfile: python_voting/participant.Dockerfile
    container_name: participant3
    ports:
      - "50053:50051"
      - "60053:60051"
    networks:
      - twopc_network
    environment:
      - NODE_ID=participant3

  participant4:
    build:
      context: .
      dockerfile: python_voting/participant.Dockerfile
    container_name: participant4
    ports:
      - "50054:50051"
      - "60054:60051"
    networks:
      - twopc_network
    environment:
      - NODE_ID=participant4

networks:
  twopc_network:
    driver: bridge
